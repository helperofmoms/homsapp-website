<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Admin Sign In — HOMs Homeschool</title><meta name="robots" content="noindex"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"/><style>
:root{ --blue:#0EA5E9; --purple:#6C5CE7; --purple-deep:#4F3DC6; --green:#43B05C; --lavender:#EEF0FD; --ink:#241F45; --muted:#5B5876; --radius-lg:28px; --shadow:0 20px 40px -18px rgba(76,63,190,0.25); }
*{box-sizing:border-box;}
body{margin:0;min-height:100vh;font-family:'Poppins',sans-serif;color:var(--ink);
  background:radial-gradient(circle at 15% 15%, #F4F1FE 0%, var(--lavender) 45%, var(--lavender) 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:26px;}
.logo-cube{width:38px;height:38px;}
.logo-text{display:flex;flex-direction:column;line-height:1;}
.logo-word{font-weight:800;font-size:24px;letter-spacing:0.5px;}
.logo-sub{font-size:10px;letter-spacing:2.5px;color:var(--blue);font-weight:700;margin-top:2px;}
.card{background:#fff;border:1px solid #F0EFFB;border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:40px 36px;max-width:400px;width:100%;text-align:center;}
.admin-badge{display:inline-block;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;font-size:11px;font-weight:800;letter-spacing:1px;padding:4px 12px;border-radius:999px;margin-bottom:16px;text-transform:uppercase;}
.card h1{font-size:22px;margin:0 0 8px;font-weight:700;}
.card p.sub{font-size:14.5px;color:var(--muted);margin:0 0 28px;line-height:1.6;}
.google-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:13px 20px;
  background:#fff;border:1.5px solid #E2E5FB;border-radius:12px;font-family:'Poppins',sans-serif;
  font-size:15px;font-weight:600;color:var(--ink);cursor:pointer;transition:box-shadow .15s ease,border-color .15s ease;text-decoration:none;}
.google-btn:hover{border-color:var(--purple);box-shadow:0 10px 20px -12px rgba(76,63,190,0.35);}
.footnote{margin-top:24px;font-size:12.5px;color:var(--muted);}
.footnote a{color:var(--purple-deep);font-weight:600;text-decoration:none;}
.footnote a:hover{text-decoration:underline;}
</style></head><body>
<div class="brand">
  <svg class="logo-cube" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><polygon fill="#0EA5E9" points="50,4 90,26 50,48 10,26"></polygon><polygon fill="#43B05C" points="10,26 50,48 50,96 10,74"></polygon><polygon fill="#8B7EF0" points="90,26 50,48 50,96 90,74"></polygon></svg>
  <div class="logo-text"><div class="logo-word"><span style="color:var(--blue)">H</span><span style="color:var(--purple-deep)">O</span><span style="color:var(--green)">M</span><span style="color:var(--purple)">s</span></div><div class="logo-sub">HOMESCHOOL</div></div>
</div>
<div class="card">
  <span class="admin-badge">Admin</span>
  <h1>Sign in to continue</h1>
  <p class="sub">Sign in with your authorized Google account to manage Enrichment Partner applications.</p>
  <a class="google-btn" href="/auth/google/start">
    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.9-2.26 5.36-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
    Sign in with Google
  </a>
  <p class="footnote">Not an Enrichment Partner yet? <a href="/become-a-partner.html">Apply here</a>.</p>
</div>
</body></html>
